name: Deploy PE GHPR App to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Permissions for GitHub Pages and branch push
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Configure GitHub Pages first to obtain the repository base path
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Application
        run: npm run build
        env:
          VITE_WEB_APP_URL: ${{ secrets.VITE_WEB_APP_URL }}
          BASE_URL: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || './' }}

      - name: Ensure .nojekyll and 404 fallback exist in dist
        run: |
          touch ./dist/.nojekyll
          if [ -f ./public/404.html ]; then
            cp ./public/404.html ./dist/404.html
          elif [ -f ./dist/index.html ]; then
            cp ./dist/index.html ./dist/404.html
          fi

      # Method 1: Deploy using modern GitHub Actions Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      # Method 2 (Fallback): Push to gh-pages branch in case repository uses Branch deployment
      - name: Deploy to gh-pages branch (Branch Fallback)
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

