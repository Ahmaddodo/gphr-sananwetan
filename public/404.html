<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>GHPR Sananwetan</title>
    <script>
      // GitHub Pages SPA redirect handler
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #475569;">
      Memuat aplikasi GHPR UPT Puskesmas Sananwetan...
    </p>
  </body>
</html>
